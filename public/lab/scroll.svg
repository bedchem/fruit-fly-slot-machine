<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <title>Two fruit flies side by side at night, faces lit by their phones, a reel passing between them</title>
  <defs>
    <g id="fly">
      <ellipse cx="-16" cy="-52" rx="11" ry="34" transform="rotate(-18 -16 -52)" fill="#fff" fill-opacity="0.3" stroke="#c98a4c" stroke-width="1.2"/>
      <path d="M-4 -30 L-14 0 M2 -30 L6 2" stroke="#b25d1a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <ellipse cx="-2" cy="-22" rx="16" ry="24" fill="#d9731f"/>
      <path d="M-16 -26 Q-2 -22 13 -28 M-17 -16 Q-2 -12 14 -18 M-15 -6 Q-2 -3 12 -8" stroke="#a9541a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="4" cy="-56" rx="15" ry="14" fill="#e3872f"/>
      <circle cx="17" cy="-76" r="11" fill="#e3872f"/>
      <circle cx="22" cy="-78" r="6.5" fill="#b8321f"/>
      <path d="M22 -86 l6 -8" stroke="#b25d1a" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-6" cy="-60" rx="9" ry="26" transform="rotate(-22 -6 -60)" fill="#fff" fill-opacity="0.4" stroke="#c98a4c" stroke-width="1.2"/>
    </g>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e7b53c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e7b53c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9433a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c9433a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="#0d1119"/>
  <!-- the window and the moon -->
  <rect x="160" y="22" width="80" height="96" fill="#141c33"/>
  <rect x="160" y="68" width="80" height="3" fill="#2b303c"/>
  <rect x="198" y="22" width="3" height="96" fill="#2b303c"/>
  <circle cx="222" cy="44" r="10" fill="#dfe7ff"/>
  <!-- the glow of two screens -->
  <ellipse cx="128" cy="116" rx="70" ry="60" fill="url(#glowA)"/>
  <ellipse cx="300" cy="116" rx="70" ry="60" fill="url(#glowB)"/>
  <!-- stools -->
  <rect x="68" y="196" width="7" height="60" fill="#c9954b"/>
  <rect x="38" y="186" width="68" height="13" rx="6" fill="#7a1f1c"/>
  <rect x="242" y="196" width="7" height="60" fill="#c9954b"/>
  <rect x="212" y="186" width="68" height="13" rx="6" fill="#7a1f1c"/>
  <!-- the flies -->
  <use href="#fly" x="72" y="188"/>
  <use href="#fly" x="246" y="188"/>
  <!-- phones, held up -->
  <rect x="116" y="92" width="26" height="48" rx="4" fill="#15161a"/>
  <rect x="118" y="95" width="22" height="42" rx="2" fill="#3a2a12"/>
  <ellipse cx="129" cy="116" rx="8" ry="3.5" fill="#e7b53c"/>
  <rect x="290" y="92" width="26" height="48" rx="4" fill="#15161a"/>
  <rect x="292" y="95" width="22" height="42" rx="2" fill="#1c1a20"/>
  <circle cx="303" cy="116" r="7" fill="#0a0a0c"/>
  <path d="M296 110 l14 12 M310 110 l-14 12" stroke="#0a0a0c" stroke-width="1.6"/>
  <!-- forelegs on the glass -->
  <path d="M86 138 Q108 128 124 124" stroke="#b25d1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M260 138 Q282 128 298 124" stroke="#b25d1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- a reel in flight between them -->
  <path d="M146 96 Q215 40 286 92" stroke="#de7a22" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <rect x="204" y="52" width="24" height="18" rx="4" fill="#de7a22"/>
  <path d="M212 56 l7 5 l-7 5 z" fill="#1b130b"/>
</svg>
