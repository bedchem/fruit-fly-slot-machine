<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <title>A fruit fly at a bar counter with a beer and a tin of nicotine pouches</title>
  <defs>
    <g id="fly">
      <ellipse cx="-16" cy="-52" rx="11" ry="34" transform="rotate(-18 -16 -52)" fill="#fff" fill-opacity="0.35" stroke="#c98a4c" stroke-width="1.2"/>
      <path d="M-4 -30 L-14 0 M2 -30 L6 2" stroke="#b25d1a" stroke-width="3" stroke-linecap="round" fill="none"/>
      <ellipse cx="-2" cy="-22" rx="16" ry="24" fill="#d9731f"/>
      <path d="M-16 -26 Q-2 -22 13 -28 M-17 -16 Q-2 -12 14 -18 M-15 -6 Q-2 -3 12 -8" stroke="#a9541a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="4" cy="-56" rx="15" ry="14" fill="#e3872f"/>
      <circle cx="17" cy="-76" r="11" fill="#e3872f"/>
      <circle cx="22" cy="-78" r="6.5" fill="#b8321f"/>
      <path d="M22 -86 l6 -8" stroke="#b25d1a" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-6" cy="-60" rx="9" ry="26" transform="rotate(-22 -6 -60)" fill="#fff" fill-opacity="0.45" stroke="#c98a4c" stroke-width="1.2"/>
    </g>
    <radialGradient id="lamp" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffb867" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb867" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" fill="#3b2d22"/>
  <!-- the back bar -->
  <rect x="210" y="46" width="180" height="6" fill="#6e4427"/>
  <rect x="210" y="96" width="180" height="6" fill="#6e4427"/>
  <g>
    <rect x="222" y="20" width="12" height="26" rx="3" fill="#2f5d34"/><rect x="225" y="12" width="6" height="10" fill="#2f5d34"/>
    <rect x="242" y="24" width="14" height="22" rx="3" fill="#8c6a2a"/><rect x="246" y="16" width="6" height="10" fill="#8c6a2a"/>
    <rect x="264" y="18" width="11" height="28" rx="3" fill="#5e1f24"/><rect x="267" y="10" width="5" height="10" fill="#5e1f24"/>
    <rect x="284" y="22" width="13" height="24" rx="3" fill="#274566"/><rect x="287" y="14" width="6" height="10" fill="#274566"/>
    <rect x="306" y="20" width="12" height="26" rx="3" fill="#9aa08a"/><rect x="309" y="12" width="6" height="10" fill="#9aa08a"/>
    <rect x="328" y="24" width="14" height="22" rx="3" fill="#6b3a17"/><rect x="332" y="16" width="6" height="10" fill="#6b3a17"/>
    <rect x="352" y="18" width="12" height="28" rx="3" fill="#2f5d34"/><rect x="355" y="10" width="6" height="10" fill="#2f5d34"/>
    <rect x="232" y="70" width="12" height="26" rx="3" fill="#6b3a17"/><rect x="235" y="62" width="6" height="10" fill="#6b3a17"/>
    <rect x="258" y="74" width="14" height="22" rx="3" fill="#274566"/><rect x="262" y="66" width="6" height="10" fill="#274566"/>
    <rect x="286" y="68" width="11" height="28" rx="3" fill="#8c6a2a"/><rect x="289" y="60" width="5" height="10" fill="#8c6a2a"/>
    <rect x="312" y="72" width="13" height="24" rx="3" fill="#5e1f24"/><rect x="315" y="64" width="6" height="10" fill="#5e1f24"/>
    <rect x="340" y="70" width="12" height="26" rx="3" fill="#9aa08a"/><rect x="343" y="62" width="6" height="10" fill="#9aa08a"/>
  </g>
  <!-- the pendant -->
  <path d="M150 0 V22" stroke="#1e1a16" stroke-width="2"/>
  <path d="M132 34 L150 20 L168 34 Z" fill="#1e1a16"/>
  <circle cx="150" cy="36" r="5" fill="#ffd9a0"/>
  <path d="M150 36 L60 200 L260 200 Z" fill="url(#lamp)"/>
  <!-- the stool -->
  <rect x="96" y="178" width="7" height="72" fill="#c9954b"/>
  <ellipse cx="100" cy="250" rx="26" ry="5" fill="#c9954b"/>
  <rect x="66" y="168" width="70" height="14" rx="7" fill="#7a1f1c"/>
  <!-- the counter -->
  <rect x="150" y="150" width="250" height="12" fill="#6e4427"/>
  <rect x="160" y="162" width="240" height="98" fill="#5b3720"/>
  <rect x="176" y="176" width="60" height="70" rx="3" fill="#4c2d19"/>
  <rect x="252" y="176" width="60" height="70" rx="3" fill="#4c2d19"/>
  <rect x="328" y="176" width="60" height="70" rx="3" fill="#4c2d19"/>
  <!-- the glass, the straw -->
  <path d="M196 104 L222 104 L219 150 L199 150 Z" fill="#e39a2a"/>
  <rect x="195" y="98" width="28" height="10" rx="4" fill="#fbf3e4"/>
  <path d="M194 96 L224 96 L220 150 L198 150 Z" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M212 140 L214 80 Q176 58 142 78" stroke="#d8342b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- the tin and its pouches -->
  <rect x="256" y="138" width="40" height="12" rx="4" fill="#1d3c63"/>
  <ellipse cx="276" cy="138" rx="20" ry="5" fill="#e8e3d6"/>
  <ellipse cx="262" cy="126" rx="20" ry="5" transform="rotate(-30 262 126)" fill="#e2e8ef"/>
  <rect x="306" y="144" width="14" height="6" rx="2" fill="#bba27a"/>
  <rect x="320" y="143" width="14" height="6" rx="2" transform="rotate(12 327 146)" fill="#bba27a"/>
  <!-- the fly, proboscis on the straw -->
  <use href="#fly" x="100" y="170"/>
  <path d="M126 104 L142 80" stroke="#b0621c" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 126 Q150 116 196 128" stroke="#b25d1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M108 132 Q160 146 262 134" stroke="#b25d1a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
