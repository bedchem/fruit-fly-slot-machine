# The site is static: every page is a real file or a folder with an
# index.html in it. Anything else is a 404, answered with the site's own page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ =404;
    }

    # the TikTok pool is rewritten in place by the refresher: always revalidate
    location /pool/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # hashed build output never changes under the same name
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
